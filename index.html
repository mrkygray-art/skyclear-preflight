<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyClear Pre-Flight</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1822">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SkyClear">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: instrument-panel checklist on the left, a light placard record card pinned on the right for observers. */
:root{
  --bg:#0e1822; --panel:#152433; --panel2:#1b2f42; --line:#27405a;
  --ink:#e8f0f7; --muted:#8fa6ba; --accent:#4cc3ff;
  --go:#3fcf8e; --warn:#f5b83d; --stop:#ff6161; --hold:#b79cff;
  --paper:#f3f6f9; --paper-ink:#122030; --paper-line:#c9d4de; --paper-muted:#566a7d;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body{padding:0 0 60px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);background:#0b141c}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 6px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);padding:3px 8px;border-radius:3px}
.badge.ok{border-color:var(--go);color:var(--go)}
.locbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:8px 0 6px}
.locbar label{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.locbar input,.locbar select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:14px}
.locbar input{width:128px}
.locbar .addrf input{width:300px;max-width:calc(100vw - 120px)}
#addrlist{display:grid;gap:6px;padding:4px 0 10px;max-width:760px}
#addrlist p{margin:0;color:var(--muted);font-size:13px}
#addrlist button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;color:var(--ink);font-size:14px}
#addrlist button:hover{border-color:var(--accent)}
#addrlist small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.locbar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
.locbar button.pri{background:var(--accent);border-color:var(--accent);color:#04202f}
.locbar button:hover{filter:brightness(1.12)}
.maptools .pinok{background:var(--go);border-color:var(--go);color:#04202f;font-weight:700}
#gpsmsg{font-size:13px;color:var(--muted);padding:0 0 12px;min-height:22px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start;padding-top:20px}
@media (max-width:960px){main{grid-template-columns:minmax(0,1fr)}}
.banner{border-radius:8px;padding:16px 18px;display:flex;gap:16px;align-items:center;border:1px solid;margin-bottom:16px}
.banner .big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.banner p{margin:0;opacity:.9}
.b-go{background:#0f2b22;border-color:var(--go)}.b-go .big{color:var(--go)}
.b-warn{background:#2c2410;border-color:var(--warn)}.b-warn .big{color:var(--warn)}
.b-stop{background:#321616;border-color:var(--stop)}.b-stop .big{color:var(--stop)}
.b-hold{background:#241d3a;border-color:var(--hold)}.b-hold .big{color:var(--hold)}
.b-info{background:#102536;border-color:var(--accent)}.b-info .big{color:var(--accent)}
@media (max-width:520px){.banner{flex-direction:column;align-items:flex-start;gap:8px}.banner .big{font-size:32px;white-space:normal}}
section.grp{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.grp h2{margin:0;padding:12px 16px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border-bottom:1px solid var(--line)}
.grp h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;align-self:center}
.row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.s-pass{background:var(--go);color:#062a1b}.s-caution{background:var(--warn);color:#2e2000}.s-fail{background:var(--stop);color:#340808}.s-hold{background:var(--hold);color:#1b1038}
.row .l{font-weight:600}
.row .v{font-family:var(--mono);font-size:13.5px;margin-top:1px;overflow-wrap:anywhere}
.row .d{color:var(--muted);font-size:13px;margin-top:2px;max-width:72ch}
.row .src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;opacity:.85}
.viz{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
@media (max-width:620px){.viz{grid-template-columns:minmax(0,1fr)}}
.viz svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.d2{color:var(--muted);font-size:13px;margin:8px 0 0}
.l{font-weight:600}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line)}
.kv{background:var(--panel);padding:10px 16px}
.kv span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv b{display:block;font-weight:500;font-family:var(--mono);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.kv b small{display:block;color:var(--muted);font-family:var(--body);font-size:12px;font-weight:400}
.seg{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 4px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:var(--mono);font-size:13px}
.seg button small{display:block;font-size:10.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.seg .rf{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:6px 16px 14px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.tl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.tn{font-size:13px;margin-top:3px}
.tv{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin-top:2px}
.tv small{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--muted)}
.td{font-size:12px;color:var(--muted);margin-top:3px}
.scroll{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 16px;border-top:1px solid var(--line)}
.tb td{padding:7px 16px;border-top:1px solid var(--line);vertical-align:top}
.tb td.n{font-family:var(--mono);white-space:nowrap}
.tb td small{display:block;color:var(--muted);font-size:11px}
.muted{color:var(--muted)}.pad{padding:10px 16px;margin:0}
.cls,.cat{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:3px;border:1px solid;margin-left:4px;white-space:nowrap}
.cls-B{color:#b79cff;border-color:#b79cff}.cls-C{color:#e0a3ff;border-color:#e0a3ff}.cls-D{color:#4cc3ff;border-color:#4cc3ff}.cls-0{color:var(--muted);border-color:var(--line)}
.cat-VFR{color:#3fcf8e;border-color:#3fcf8e}.cat-MVFR{color:#5ba8ff;border-color:#5ba8ff}.cat-IFR{color:#ff6161;border-color:#ff6161}.cat-LIFR{color:#ff7ad9;border-color:#ff7ad9}
.facs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--line)}
.fac{background:var(--panel);padding:12px 16px}
.fh{font-size:14px;margin-bottom:6px}.fd{float:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.fac dl{margin:0;display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;font-size:13px}
.fac dt{color:var(--muted)}.fac dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.foot2{margin:0;padding:10px 16px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.srcbar{font-family:var(--mono);font-size:12px;padding:8px 16px;color:var(--muted);border-bottom:1px solid var(--line)}
.srcbar.live{color:var(--go)}.srcbar.sample{color:var(--warn);background:#2c2410}
.wxh{padding:12px 16px 4px;font-size:15px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:10px 16px 4px}
pre.raw{margin:0 16px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
table.bd{width:calc(100% - 32px);margin:2px 16px 4px;border-collapse:collapse;font-size:13px}
.bd td{padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top}
.bd td.tk{font-family:var(--mono);color:var(--accent);white-space:nowrap;padding-right:12px}
.bd td.lb{color:var(--muted);white-space:nowrap;padding-right:12px}
.gh{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;padding:10px 16px 2px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.fields label{display:block;font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.fields input{width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:14px}
.fields input:disabled{opacity:.45}
.sub{padding:9px 16px 4px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.todo{display:flex;gap:12px;align-items:flex-start;padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{margin-top:3px;width:18px;height:18px;accent-color:var(--go);flex:none}
.todo span b{font-weight:600}.todo span small{display:block;color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:12px 16px 0}
.bar i{display:block;height:100%;background:var(--go);transition:width .25s}
.card{position:sticky;top:14px;background:var(--paper);color:var(--paper-ink);border-radius:8px;overflow:hidden;border:1px solid var(--paper-line)}
@media (max-width:960px){.card{position:static}}
.card .sample{background:#ffd9a0;color:#4a2b00;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:5px 8px;font-weight:500}
.card .sample.liveb{background:#cdf3df;color:#0b4a2d}
.card .head{padding:14px 16px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.card .id{font-family:var(--mono);font-size:12px;color:var(--paper-muted);text-align:right}
.card .st{margin:0 16px;border-radius:6px;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.st.c-go{background:#cdf3df;color:#0b4a2d}.st.c-warn{background:#fde6b3;color:#5a3d00}.st.c-stop{background:#ffd0d0;color:#6d0f0f}.st.c-hold{background:#e2d9ff;color:#2f1a6b}.st.c-info{background:#cfeaff;color:#08405f}
.card .meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;padding:12px 16px;font-size:13px}
.card .meta dt{color:var(--paper-muted)}.card .meta dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.card table{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:12.5px}
.card td{border-top:1px solid var(--paper-line);padding:4px;vertical-align:top}
.card td:first-child{width:22px;font-weight:700;text-align:center}
.card td.v{font-family:var(--mono);text-align:right;color:var(--paper-muted);max-width:150px;overflow-wrap:anywhere}
.m-pass{color:#117a49}.m-caution{color:#a56a00}.m-fail{color:#c02525}.m-hold{color:#5b3fc2}
.card .foot{padding:12px 16px;border-top:1px solid var(--paper-line);margin-top:10px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.qr{width:84px;height:84px;border:2px dashed var(--paper-line);display:grid;place-items:center;text-align:center;font-size:10px;color:var(--paper-muted);font-family:var(--mono);padding:4px}
.hash{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.hash small{display:block;color:var(--paper-muted);font-family:var(--body);font-size:11.5px}
.legal{padding:10px 16px 12px;font-size:11.5px;color:var(--paper-muted);border-top:1px solid var(--paper-line)}
.actions{display:flex;gap:8px;padding:0 16px 14px}
.actions button{flex:1;background:var(--paper-ink);color:#fff;border:0;border-radius:5px;padding:9px 10px;cursor:pointer;font-weight:600}
.actions button:hover{filter:brightness(1.25)}
.copybox{margin:0 16px 14px;background:#fff;border:1px solid var(--paper-line);border-radius:5px;padding:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;max-height:160px;overflow:auto;display:none}

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.maptools{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:13px}
.maptools label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.maptools button{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:13px}
.maptools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.maptools input[type=range]{width:110px;accent-color:var(--accent)}
#map{height:min(62vh,520px);min-height:340px;background:#0b141c;z-index:0}
#map.pinning{cursor:crosshair}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leaflet-container{font-family:var(--body)}
.apt{position:relative}
.apd{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#111;border:2px solid #fff}
.apl{position:absolute;left:7px;top:-9px;font:600 11px var(--mono);color:#111;background:rgba(255,255,255,.85);padding:0 3px;border-radius:2px;white-space:nowrap}
.fields select{width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:14px}
.fields small{display:block;font-size:12px;margin-top:3px;font-family:var(--body);text-transform:none;letter-spacing:0}
.fields small.ok{color:var(--go)}.fields small.bad{color:var(--stop)}
.reqhead{padding:22px 0 8px}.reqhead h1{margin:0;font-family:var(--display);font-size:34px;letter-spacing:.04em;text-transform:uppercase}.reqhead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
#view-req,#view-laanc,#view-res{max-width:860px;padding-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:6px 0 18px}
.qk{display:block;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;color:var(--ink);text-decoration:none}
.qk:hover{border-color:var(--accent)}
.qk b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.qk small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rlist{list-style:none;margin:0;padding:4px 16px 10px}
.rlist li{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rlist li:first-child{border-top:0}
.rl a{color:var(--accent);font-weight:600}
.rd{color:var(--muted);font-size:14px}.rd a{color:var(--accent)}
#view-res .tb a{color:var(--accent)}
@media(max-width:620px){.rlist li{grid-template-columns:1fr;gap:2px}}
.req h3{margin:14px 0 6px;font-family:var(--display);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.steps{margin:0;padding-left:22px}.steps li{margin:0 0 6px}
.tb.kv th{width:130px;border-top:1px solid var(--line);padding:7px 10px 7px 0;vertical-align:top}.tb.kv td{padding:7px 0}
.req a{color:var(--accent)}
.lnow{display:grid;gap:4px;border-left:4px solid;padding:6px 12px;border-radius:4px}
.lnow.need{border-color:var(--warn);background:rgba(245,184,61,.08)}.lnow.need>b{color:var(--warn)}
.lnow.ok{border-color:var(--go);background:rgba(63,207,142,.08)}.lnow.ok>b{color:var(--go)}
.lnow span{color:var(--muted);font-size:14px}.lnow span b{color:var(--ink)}
.lsmall{font-size:13px;padding:0 16px 12px}
.saved{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px 0;font-size:13px;color:var(--muted)}
.saved button{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.req{padding:12px 16px}.req p{margin:0 0 8px}.req p.note{color:var(--muted);font-size:13px;margin:0}.req ul{margin:0;padding-left:18px}.req li{margin:0 0 6px}
.altline{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:-6px 0 16px}
.altline>div{background:var(--panel);padding:9px 14px}
.altline span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.altline b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15}
.authl.need b{color:var(--warn)}.authl.none b{color:var(--go)}
.altwarn{margin:-8px 0 16px;padding:8px 14px;background:#2c2410;border:1px solid var(--warn);border-radius:6px;color:var(--warn);font-size:13px}
[hidden]{display:none!important}
</style>

/* ---- geometry ---- */
const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
function distMi(lat1,lon1,lat2,lon2){const R=3958.8;const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function bearing(lat1,lon1,lat2,lon2){const y=Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));return (toDeg(Math.atan2(y,x))+360)%360}
const COMP=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass=b=>COMP[Math.round(b/22.5)%16];
function dms(v,pos,neg){const h=v>=0?pos:neg;v=Math.abs(v);const d=Math.floor(v);const m=Math.floor((v-d)*60);const s=((v-d)*60-m)*60;return d+"°"+String(m).padStart(2,"0")+"'"+s.toFixed(1).padStart(4,"0")+'" '+h}
function around(lat,lon){return AIRPORTS.map(a=>{const d=distMi(lat,lon,a.lat,a.lon);return Object.assign({},a,{dist:d,nm:d/NM,brg:bearing(lat,lon,a.lat,a.lon)})}).sort((a,b)=>a.dist-b.dist)}
/* Approximate controlled-surface rings. Real boundaries are irregular: the FAA layer or the chart decides. */
const RING={D:4,C:5}; // NM, surface area radius
function ringInfo(a){ if(a.cls==="D")return {r:RING.D,label:"Class D surface area, about 4 NM"}; if(a.cls==="C")return {r:RING.C,label:"Class C surface area, about 5 NM (shelf to about 10 NM)"}; return null }
function approxAir(list){
  const hits=[];
  list.forEach(a=>{
    if(a.cls==="D"&&a.nm<=RING.D)hits.push({cls:"D",a,why:"inside the approximate 4 NM Class D surface area of "+a.id});
    if(a.cls==="C"&&a.nm<=RING.C)hits.push({cls:"C",a,why:"inside the approximate 5 NM Class C surface area of "+a.id});
    if(a.cls==="B"&&a.nm<=6)hits.push({cls:"B",a,why:"within about 6 NM of "+a.id+", where Class B starts at or near the surface"});
  });
  return hits;
}

/* ---- sun (NOAA sunrise equation) ---- */
function sunTimes(lat,lon,date){
  const jd=date.getTime()/86400000+2440587.5;
  const n=Math.ceil(jd-2451545.0+0.0008);
  const Js=n-lon/360, M=(357.5291+0.98560028*Js)%360, Mr=toRad(M);
  const C=1.9148*Math.sin(Mr)+0.02*Math.sin(2*Mr)+0.0003*Math.sin(3*Mr);
  const lam=(M+C+180+102.9372)%360, lr=toRad(lam);
  const Jt=2451545.0+Js+0.0053*Math.sin(Mr)-0.0069*Math.sin(2*lr);
  const sd=Math.sin(lr)*Math.sin(toRad(23.4397)), cd=Math.cos(Math.asin(sd));
  const f=a=>{const c=(Math.sin(toRad(a))-Math.sin(toRad(lat))*sd)/(Math.cos(toRad(lat))*cd);if(c>1||c<-1)return null;return toDeg(Math.acos(c))};
  const toDate=j=>new Date((j-2440587.5)*86400000);
  const w=f(-0.833), c=f(-6);
  return {sunrise:w==null?null:toDate(Jt-w/360),sunset:w==null?null:toDate(Jt+w/360),civilBegin:c==null?null:toDate(Jt-c/360),civilEnd:c==null?null:toDate(Jt+c/360)};
}

/* ---- METAR / TAF decoding ---- */
const WXD={MI:"shallow",PR:"partial",BC:"patches of",DR:"low drifting",BL:"blowing",SH:"showers of",TS:"thunderstorm with",FZ:"freezing"};
const WXP={DZ:"drizzle",RA:"rain",SN:"snow",SG:"snow grains",IC:"ice crystals",PL:"ice pellets",GR:"hail",GS:"small hail",UP:"unknown precipitation",BR:"mist",FG:"fog",FU:"smoke",VA:"volcanic ash",DU:"dust",SA:"sand",HZ:"haze",PY:"spray",PO:"dust whirls",SQ:"squalls",FC:"funnel cloud",SS:"sandstorm",DS:"duststorm"};
const COVER={FEW:"Few clouds",SCT:"Scattered clouds",BKN:"Broken clouds",OVC:"Overcast"};
const WXRE=/^(\+|-|VC)?((?:MI|PR|BC|DR|BL|SH|TS|FZ)?(?:DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS)+|TS|SH|FZ)$/;
function decWx(t){const m=t.match(WXRE);if(!m)return null;let s="";const pre=m[1]||"";let body=m[2];if(pre==="+")s="Heavy ";else if(pre==="-")s="Light ";else if(pre==="VC")s="In the vicinity: ";const parts=[];while(body.length){const d=body.slice(0,2);if(WXD[d]){parts.push(WXD[d]);body=body.slice(2)}else if(WXP[d]){parts.push(WXP[d]);body=body.slice(2)}else break}return s+parts.join(" ")}
const cToF=c=>Math.round(c*9/5+32);
const tnum=s=>s[0]==="M"?-parseInt(s.slice(1),10):parseInt(s,10);
function hhmmLocal(day,hh,mm,now){const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),day,hh,mm));if(d.getTime()-now.getTime()>2*86400000)d.setUTCMonth(d.getUTCMonth()-1);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" local"}
/* decode one weather token shared by METAR and TAF; returns {label,text,data} or null */
function decCommon(t,ctx){
  let m;
  if((m=t.match(/^(VRB|\d{3})(\d{2,3})(?:G(\d{2,3}))?KT$/))){const calm=+m[2]===0;return {label:"Wind",text:calm?"Calm":(m[1]==="VRB"?"Variable":"From "+m[1]+"°")+" at "+(+m[2])+" kt"+(m[3]?", gusting "+(+m[3])+" kt":""),data:{wind:{dir:m[1],spd:+m[2],gust:m[3]?+m[3]:null}}}}
  if((m=t.match(/^(\d{3})V(\d{3})$/)))return {label:"Variable wind",text:"Direction varying between "+m[1]+"° and "+m[2]+"°"};
  if(/^(P|M)?\d+(\/\d+)?SM$/.test(t)){const x=t.replace("SM","");const p=x[0]==="P"?"more than ":x[0]==="M"?"less than ":"";const v=x.replace(/^[PM]/,"");let n=v.includes("/")?(+v.split("/")[0])/(+v.split("/")[1]):+v;return {label:"Visibility",text:p+v+" statute mile"+(n===1?"":"s"),data:{vis:p==="more than "?Math.max(n,6.1):n}}}
  if(/^\d{4}$/.test(t)&&ctx&&ctx.allowMeters){const n=+t;const sm=n>=9999?10:n/1609.34;return {label:"Visibility",text:(n>=9999?"10 km or more":n+" m")+" (about "+sm.toFixed(1)+" SM)",data:{vis:sm}}}
  if(t==="CAVOK")return {label:"CAVOK",text:"Visibility 10 km or more, no significant cloud",data:{vis:10,sky:[]}};
  if((m=t.match(/^R(\d{2}[LCR]?)\/([PM])?(\d{4})(?:V([PM])?(\d{4}))?FT$/)))return {label:"Runway visual range",text:"Runway "+m[1]+": "+(m[2]==="P"?"more than ":m[2]==="M"?"less than ":"")+m[3]+" ft"+(m[5]?" varying to "+m[5]+" ft":"")};
  if(t==="NSW")return {label:"Weather",text:"No significant weather"};
  const wx=decWx(t);if(wx&&!/^(TS|SH|FZ)$/.test(t)||(wx&&t.length>2))return {label:"Weather",text:wx,data:{wx:t}};
  if((m=t.match(/^(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?$/)))return {label:"Sky",text:COVER[m[1]]+" at "+(+m[2]*100).toLocaleString()+" ft above ground"+(m[3]?" ("+(m[3]==="CB"?"cumulonimbus":"towering cumulus")+")":""),data:{sky:[{c:m[1],h:+m[2]*100}]}};
  if((m=t.match(/^VV(\d{3})$/)))return {label:"Sky",text:"Vertical visibility "+(+m[1]*100).toLocaleString()+" ft (sky obscured)",data:{sky:[{c:"OVC",h:+m[1]*100}]}};
  if(["SKC","CLR","NSC"].includes(t))return {label:"Sky",text:t==="NSC"?"No significant cloud":"Clear skies",data:{sky:[]}};
  if((m=t.match(/^WS(\d{3})\/(\d{3})(\d{2,3})KT$/)))return {label:"Wind shear",text:"At "+(+m[1]*100)+" ft: wind from "+m[2]+"° at "+(+m[3])+" kt"};
  return null;
}
function flightCat(vis,sky){
  const ceil=(sky||[]).filter(s=>s.c==="BKN"||s.c==="OVC").reduce((a,s)=>Math.min(a,s.h),Infinity);
  const v=vis==null?10:vis;
  if(ceil<500||v<1)return "LIFR"; if(ceil<1000||v<3)return "IFR"; if(ceil<=3000||v<=5)return "MVFR"; return "VFR";
}
function decodeMetar(raw,now){
  now=now||new Date();
  const toks=raw.trim().replace(/\s+/g," ").split(" ");const items=[];const out={raw:raw.trim(),sky:[],wx:[],vis:null,wind:null,temp:null,dew:null,alt:null,station:null};
  let i=0,inRmk=false,m;
  while(i<toks.length){
    let t=toks[i];
    if(inRmk){
      let d=t;
      if(t==="AO2")d="Automated station with precipitation sensor";
      else if(t==="AO1")d="Automated station without precipitation sensor";
      else if((m=t.match(/^SLP(\d{3})$/))){const p=+m[1]/10;d="Sea-level pressure "+((p<50?1000+p:900+p)).toFixed(1)+" hPa"}
      else if((m=t.match(/^T([01])(\d{3})([01])(\d{3})$/))){const a=(m[1]==="1"?-1:1)*(+m[2])/10,b=(m[3]==="1"?-1:1)*(+m[4])/10;d="Precise temperature "+a.toFixed(1)+" °C, dew point "+b.toFixed(1)+" °C"}
      else if(t==="$")d="Station needs maintenance";
      else if(/^P\d{4}$/.test(t))d="Precipitation last hour "+(+t.slice(1)/100).toFixed(2)+" in";
      else d="";
      items.push({tok:t,label:"Remark",text:d||"Additional remark (see raw text)"});i++;continue;
    }
    if(t==="METAR"||t==="SPECI"){items.push({tok:t,label:"Report type",text:t==="METAR"?"Routine observation":"Special observation (conditions changed)"});i++;continue}
    if(!out.station&&/^[A-Z][A-Z0-9]{3}$/.test(t)){out.station=t;const ap=AIRPORTS.find(a=>a.icao===t);items.push({tok:t,label:"Station",text:t+(ap?" · "+ap.name:"")});i++;continue}
    if((m=t.match(/^(\d{2})(\d{2})(\d{2})Z$/))){out.time={day:+m[1],hh:+m[2],mm:+m[3]};items.push({tok:t,label:"Observed",text:"Day "+m[1]+" at "+m[2]+":"+m[3]+" UTC ("+hhmmLocal(+m[1],+m[2],+m[3],now)+")"});i++;continue}
    if(t==="AUTO"||t==="COR"){items.push({tok:t,label:t==="AUTO"?"Automated":"Correction",text:t==="AUTO"?"Fully automated report, no human observer":"Corrected report"});i++;continue}
    if(t==="RMK"){inRmk=true;items.push({tok:t,label:"Remarks",text:"Remarks section follows"});i++;continue}
    if(/^\d$/.test(t)&&/^\d\/\dSM$/.test(toks[i+1]||"")){const f=toks[i+1].replace("SM","").split("/");const n=+t+(+f[0])/(+f[1]);out.vis=n;items.push({tok:t+" "+toks[i+1],label:"Visibility",text:t+" "+f[0]+"/"+f[1]+" statute miles"});i+=2;continue}

function decodeTaf(raw,now){

    if(!out.valid&&(m=t.match(/^(\d{2})(\d{2})\/(\d{2})(\d{2})$/))){out.valid=t;out.head.push({tok:t,label:"Valid",text:"Day "+m[1]+" "+m[2]+":00 UTC through day "+m[3]+" "+m[4]+":00 UTC"});i++;continue}
    if((m=t.match(/^FM(\d{2})(\d{2})(\d{2})$/))){groups.push(cur);cur={head:"FM "+t.slice(2),tokens:[t],items:[{tok:t,label:"From",text:"Conditions change permanently from day "+m[1]+" at "+m[2]+":"+m[3]+" UTC"}]};i++;continue}
    if(t==="TEMPO"||t==="BECMG"||/^PROB\d{2}$/.test(t)){

      i++;let per="";if((m=(toks[i]||"").match(/^(\d{2})(\d{2})\/(\d{2})(\d{2})$/))){per=toks[i];txt+=" between day "+m[1]+" "+m[2]+":00 and day "+m[3]+" "+m[4]+":00 UTC";i++}
      cur={head:hd+(per?" "+per:""),tokens:[],items:[{tok:hd+(per?" "+per:""),label:"Change group",text:txt}]};continue}
    if(/^T[XN]M?\d{2}\/\d{4}Z$/.test(t)){cur.items.push({tok:t,label:t[1]==="X"?"Max temperature":"Min temperature",text:t.slice(2).split("/")[0].replace("M","-")+" °C expected"});i++;continue}

    cur.items.push({tok:t,label:"Other",text:"Not decoded"});i++;

/* ---- parsing fetched/sample text ---- */
function splitMetars(txt){return txt.split(/\n+/).map(s=>s.trim()).filter(l=>/^(METAR |SPECI )?[A-Z][A-Z0-9]{3} \d{6}Z/.test(l))}
function splitTafs(txt){const blocks=[];let cur=null;txt.split(/\n/).forEach(l=>{if(!l.trim())return;if(/^\S/.test(l)){if(cur)blocks.push(cur);cur=l.trim()}else if(cur)cur+="\n  "+l.trim()});if(cur)blocks.push(cur);return blocks.filter(b=>/^(TAF )?[A-Z][A-Z0-9]{3} \d{6}Z|^TAF /.test(b))}

/* ---- sample weather for the offline preview ---- */
const COASTAL=["KLAX","KHHR","KSMO","KTOA","KLGB","KSLI","KSNA","KFUL","KSAN","KMYF","KCRQ","KOXR","KCMA"];
function p2(n){return String(n).padStart(2,"0")}
function sampleWx(icao,now){
  now=now||new Date();let h=0;for(const c of icao)h=(h*31+c.charCodeAt(0))>>>0;
  const t=new Date(now.getTime()-7*60000);const day=p2(t.getUTCDate()),hh=p2(t.getUTCHours()),mm=p2(Math.floor(t.getUTCMinutes()/10)*10+3>59?53:Math.floor(t.getUTCMinutes()/10)*10+3);
  const coastal=COASTAL.includes(icao);const dir=240+(h%5)*10,spd=5+(h%7),gust=h%3===0?spd+7:null;
  const sky=coastal?"FEW008 BKN014":"FEW200";const vis=coastal?"6SM HZ":"10SM";const temp=coastal?14+(h%4):10+(h%5),dew=coastal?temp-3:temp-9;
  const metar="METAR "+icao+" "+day+hh+mm+"Z "+(p2(dir)+"").padStart(3,"0").slice(-3)+p2(spd)+(gust?"G"+p2(gust):"")+"KT "+vis+" "+sky+" "+p2(temp)+"/"+p2(dew)+" A"+(2995+(h%6))+" RMK AO2 SLP"+(150+(h%9))+" T0"+p2(temp)+"0"+"0"+p2(dew)+"0";
  const st=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate(),t.getUTCHours()));st.setUTCMinutes(0);
  const f=(o)=>{const d=new Date(st.getTime()+o*3600000);return p2(d.getUTCDate())+p2(d.getUTCHours())};
  const taf="TAF "+icao+" "+f(0)+"20Z "+f(0)+"/"+f(24)+" "+p2(dir)+p2(spd)+"KT P6SM "+sky+"\n  FM"+f(6)+"00 27010KT P6SM SCT025\n  TEMPO "+f(10)+"/"+f(14)+" 3SM BR BKN008\n  BECMG "+f(15)+"/"+f(17)+" 25006KT P6SM FEW010\n  PROB30 "+f(20)+"/"+f(23)+" 2SM BR OVC005";
  return {metar:metar,taf:taf};
}

    add("Weather","precip","Precipitation",wet?(bad?"fail":"caution"):"pass",wet?m.wx.join(" "):"None reported",wet?"Most consumer drones are not rated for rain or snow.":"",src);
  } else add("Weather","wx","Weather report","caution","Not loaded","Press Refresh to pull METAR and TAF.","");

    if(now>=s.sunrise&&now<=s.sunset){const mins=Math.round((s.sunset-now)/60000);dv="Daylight · sunset "+tfmt(s.sunset)+" ("+Math.floor(mins/60)+" h "+mins%60+" min)"}
    else if((now>s.sunset&&now<=s.civilEnd)||(now>=s.civilBegin&&now<s.sunrise)){ds="caution";dv="Civil twilight · sunrise "+tfmt(s.sunrise)+", sunset "+tfmt(s.sunset);dd="Anti-collision lights visible for 3 SM are required."}

function overall(C){
  const f=C.filter(c=>c.status==="fail"),h=C.filter(c=>c.status==="hold"),w=C.filter(c=>c.status==="caution");
  const left=MANUAL_IDS.filter(id=>!S.manual[id]).length;
  if(f.length)return {k:"stop",t:"No-go",d:f.length+" blocking condition"+(f.length>1?"s":"")+": "+f.map(c=>c.label.toLowerCase()).join(", ")+"."};
  if(h.length)return {k:"hold",t:"Hold",d:"Authorization is needed before launch. Enter the LAANC authorization number below."};
  if(left)return {k:"info",t:"Incomplete",d:left+" pilot confirmation"+(left>1?"s":"")+" remaining."+(w.length?" "+w.length+" caution"+(w.length>1?"s":"")+" noted.":"")};
  if(w.length)return {k:"warn",t:"Go with cautions",d:w.length+" caution"+(w.length>1?"s":"")+": "+w.map(c=>c.label.toLowerCase()).join(", ")+"."};
  return {k:"go",t:"Go",d:"All checks passed and the pilot confirmed every item."};
}

async function sha(txt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of txt)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return h.toString(16).padStart(8,"0").repeat(8)}}
function tick(){if(S.loc.src==="gps"&&S.loc.fixAt&&!S.loc.stale&&Date.now()-S.loc.fixAt>GPS_MAX_AGE){S.loc.stale=true;render()}const e=$("#valid");if(!e)return;const mins=60-Math.floor((Date.now()-S.scanAt.getTime())/60000);e.textContent=mins>0?"valid "+mins+" min":"EXPIRED, rescan"}
setInterval(tick,15000);

/* ---- data loading ---- */
async function loadAll(){
  const tok=++S.token;S.scanAt=new Date();S.scanId=newId();
  S.wx.mode="loading";S.elev={ft:null,src:""};S.place={text:"",src:""};S.faa={state:"none",surface:[],grid:null};
  const D=derived();render();mapUpdate(true);
  const L=S.loc;
  const ids=D.wxStations.map(a=>a.icao);
  const jobs=[];
  jobs.push((async()=>{
    try{
      const [mj,tj]=await Promise.all([fetchJson(awc("metar","ids="+ids.join(",")+"&format=json"),9000),fetchJson(awc("taf","ids="+ids.join(",")+"&format=json"),9000).catch(()=>[])]);
      if(tok!==S.token)return;
      const metar={},taf={},obs={};
      (Array.isArray(mj)?mj:[]).forEach(o=>{const s=o.icaoId;if(s&&o.rawOb&&!metar[s]){metar[s]=o.rawOb;obs[s]=o}});
      (Array.isArray(tj)?tj:[]).forEach(o=>{const s=o.icaoId;if(s&&o.rawTAF&&!taf[s])taf[s]=o.rawTAF});
      if(!Object.keys(metar).length)throw new Error("no METAR returned");
      S.wx={mode:"live",at:new Date(),stations:ids,metar,taf,obs,err:""};
    }catch(e){
      if(tok!==S.token)return;
      const metar={},taf={};ids.forEach(i=>{const s=sampleWx(i);metar[i]=s.metar;taf[i]=s.taf});
      S.wx={mode:"sample",at:new Date(),stations:ids,metar,taf,err:e&&e.name==="AbortError"?"timed out":"blocked or offline"};
    }
    render();
  })());
  jobs.push((async()=>{try{const j=await fetchJson("https://epqs.nationalmap.gov/v1/json?x="+L.lon+"&y="+L.lat+"&units=Feet&wkid=4326&includeDate=false");if(tok!==S.token)return;const v=Number(j.value);if(isFinite(v)&&v>-500){S.elev={ft:Math.round(v),src:"USGS elevation service"};render()}}catch(e){}})());
  jobs.push((async()=>{try{const j=await fetchJson("https://api.weather.gov/points/"+L.lat.toFixed(4)+","+L.lon.toFixed(4));if(tok!==S.token)return;const r=j.properties.relativeLocation.properties;S.place={text:r.city+", "+r.state,src:"NWS"};render()}catch(e){}})());
  jobs.push((async()=>{
    try{
      const q=(svc,fields,r)=>"https://services6.arcgis.com/ssFJjBXIUyZDrSYZ/arcgis/rest/services/"+svc+"/FeatureServer/0/query?where=1%3D1&geometry="+L.lon+"%2C"+L.lat+"&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects"+(r?"&distance="+r+"&units=esriSRUnit_Meter":"")+"&outFields="+fields+"&returnGeometry=false&f=json";
      const a=await fetchJson(q("Class_Airspace","*"),9000);if(tok!==S.token)return;
      if(!a.features)throw new Error("bad layer");
      const surface=a.features.map(f=>f.attributes).filter(x=>x.CLASS&&["B","C","D","E"].includes(String(x.CLASS).toUpperCase())&&(Number(x.LOWER_VAL)<=0)).map(x=>({cls:String(x.CLASS).toUpperCase(),name:x.NAME||x.ICAO_ID||""}));
      let grid=null;try{const g=await fetchJson(q("FAA_UAS_FacilityMap_Data","*"),9000);const f=(g.features||[]).map(f=>Number(f.attributes.CEILING)).filter(n=>isFinite(n));if(f.length)grid=Math.min(...f)}catch(e){}
      if(tok!==S.token)return;S.faa={state:"live",surface,grid,edge:null};render();
      // GPS: does anything different lie inside the accuracy circle? (one airspace query + one grid query)
      if(L.src==="gps"&&L.acc>0){
        try{
          const r=Math.min(Math.round(L.acc),2000);
          const [an,gn]=await Promise.all([fetchJson(q("Class_Airspace","CLASS,NAME,LOWER_VAL",r),9000),fetchJson(q("FAA_UAS_FacilityMap_Data","CEILING",r),9000)]);
          if(tok!==S.token)return;
          if(!an.features||!gn.features)throw new Error("bad layer");
          const key=x=>x.cls+"|"+x.name;
          const near=an.features.map(f=>f.attributes).filter(x=>x.CLASS&&["B","C","D","E"].includes(String(x.CLASS).toUpperCase())&&Number(x.LOWER_VAL)<=0).map(x=>({cls:String(x.CLASS).toUpperCase(),name:x.NAME||x.ICAO_ID||""}));
          const here=new Set(surface.map(key)),diff=near.filter(x=>!here.has(key(x)));
          const ceil=[...new Set(gn.features.map(f=>Number(f.attributes.CEILING)).filter(n=>isFinite(n)))].sort((a,b)=>a-b);
          const gridX=ceil.length>1||(ceil.length===1&&grid!==ceil[0])||(grid!=null&&!ceil.length);
          S.faa.edge={checked:true,air:diff.length?[...new Set(diff.map(x=>"Class "+x.cls+(x.name?" "+x.name:"")))].join(", "):"",grid:gridX,ceilings:ceil,gridMin:ceil.length?ceil[0]:null};
        }catch(e){if(tok!==S.token)return;S.faa.edge={checked:false}}
        render();
      }
    }catch(e){}
  })());
  await Promise.all(jobs);
}

let MAP=null,MAPL=null,PIN=false,CHARTL=null,CHARTS=[],YOU=null;

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri"}).addTo(MAP);

  CHARTL=L.tileLayer("l/{z}/{x}/{y}.webp",{tileSize:512,zoomOffset:-1,minNativeZoom:10,maxNativeZoom:12,maxZoom:17,opacity:.85,bounds:L.latLngBounds([[31.99,-122.41],[36.2,-114.5]]),errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}).addTo(MAP);

  const SDT=L.tileLayer("d/{z}/{x}/{y}.webp",{tileSize:512,zoomOffset:-1,minNativeZoom:9,maxNativeZoom:11,maxZoom:17,opacity:.85,bounds:L.latLngBounds([[32.49,-117.99],[33.62,-116.29]]),errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}).addTo(MAP);
  CHARTS=[CHARTL,SFT,SDT];
  MAP.attributionControl.addAttribution("Charts: FAA Los Angeles and San Francisco VFR Sectionals, San Diego VFR Terminal Area Chart");
  L.control.scale({imperial:true,metric:false,position:"bottomleft"}).addTo(MAP);
  MAPL=L.layerGroup().addTo(MAP);
  MAP.on("click",e=>{if(!PIN)return;setPin(false);setLoc(e.latlng.lat,e.latlng.lng,"manual","Dropped pin",{pin:true,pinOk:false});$("#gpsmsg").textContent="Pin dropped. If it sits exactly on your launch spot, press Confirm pin under the map."});
  $("#pinok").onclick=()=>{if(!S.loc.pin)return;S.loc.pinOk=true;$("#gpsmsg").textContent="Pin confirmed as your launch spot.";render()};
  $("#chartop").oninput=e=>{CHARTS.forEach(c=>c.setOpacity(e.target.value/100));$("#chartopv").textContent=e.target.value+"%"};
  $("#chartvis").onchange=e=>{CHARTS.forEach(c=>{if(e.target.checked)c.addTo(MAP);else MAP.removeLayer(c)})};
  $("#recenter").onclick=()=>mapUpdate(true);

function setPin(on){PIN=on;const b=$("#pinbtn");b.setAttribute("aria-pressed",on);b.textContent=on?"Tap the map to set position…":"Drop pin";$("#map").classList.toggle("pinning",on)}
function mapUpdate(fit){
  if(!MAP)return;
  const Lc=S.loc,D=derived(),MI=1609.344,ll=[Lc.lat,Lc.lon];
  MAPL.clearLayers();
  // approximate controlled-airspace rings
  D.list.forEach(ap=>{
    if(ap.dist>S.radius+30)return;
    const ri=ringInfo(ap);
    if(ap.cls==="B"){L.circle([ap.lat,ap.lon],{radius:6*NM*MI,color:"#7b5cff",weight:2,dashArray:"6 5",fillColor:"#7b5cff",fillOpacity:.08,interactive:false}).addTo(MAPL)}
    else if(ri){const col=ap.cls==="C"?"#c04bff":"#1a9bff";L.circle([ap.lat,ap.lon],{radius:ri.r*NM*MI,color:col,weight:2,fillColor:col,fillOpacity:.1,interactive:false}).addTo(MAPL)}
    if(ap.dist<=Math.max(S.radius*2.5,12)){
      L.marker([ap.lat,ap.lon],{interactive:true,keyboard:false,icon:L.divIcon({className:"apt",html:'<span class="apd"></span><span class="apl">'+esc(ap.id)+"</span>",iconSize:[0,0]})}).bindTooltip(esc(ap.id)+" · "+esc(ap.name)+(ap.cls?" · Class "+ap.cls:" · no tower")+" · "+fmt1(ap.dist)+" mi",{direction:"top"}).addTo(MAPL)}
  });
  // search radius
  L.circle(ll,{radius:S.radius*MI,color:"#0a7d4d",weight:2,dashArray:"2 6",fill:false,interactive:false}).addTo(MAPL);
  if(S.loc.acc)L.circle(ll,{radius:S.loc.acc,color:"#1f6fe5",weight:1,fillColor:"#1f6fe5",fillOpacity:.15,interactive:false}).addTo(MAPL);
  L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#12b76a",fillOpacity:1}).bindTooltip("You · "+Lc.lat.toFixed(5)+", "+Lc.lon.toFixed(5)).addTo(MAPL);
  if(fit){const dy=S.radius*1.15/69.0,dx=dy/Math.cos(toRad(Lc.lat));MAP.fitBounds([[Lc.lat-dy,Lc.lon-dx],[Lc.lat+dy,Lc.lon+dx]],{animate:false,maxZoom:15})}
}

   <li><b>Part 107 or recreational:</b> both can use LAANC. Recreational flyers need their TRUST certificate and pick recreational in the app.</li>
   <li><b>Altitude:</b> ask at or below the grid number for fast approval. Above the grid is "further coordination": a manual FAA review that should be filed days ahead and can take a long time or be declined.</li>
   <li><b>Fly what was approved:</b> stay inside the area, altitude and time window on the authorization.</li>
   <li><b>Not covered by LAANC:</b> TFRs and NOTAMs. Check tfr.faa.gov and the TFRs shown in your LAANC app.</li>
   <li><b>No LAANC grid at a spot:</b> requests there go through the FAA DroneZone instead.</li>
  </ul><p class="note">Contact details were checked on each company's website on Nov 25, 2026. SkyClear is not affiliated with Aloft or Airspace Link.</p></div></section>`;
}

/* ---- Resources tab ---- */
// Every URL and phone number below was checked on 2026-11-25 (FAA UAS Support Center number and
// email from faa.gov/uas/contact_us; NOTAM Search is the link on the FAA's own NOTAM page).
const RES_METAR_IDS="KLAX,KHHR,KBUR,KTOA,KSMO,KLGB";
const RES={
  tfr:"https://tfr.faa.gov/",
  notam:"https://notams.aim.faa.gov/notamSearch/",
  metar:"https://aviationweather.gov/data/metar/?ids="+RES_METAR_IDS,
  parks:"https://www.parks.ca.gov/?page_id=29229"
};
function resHTML(){
  const ext=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}<span class="sr"> (opens in a new tab)</span> ↗</a>`;
  const aloft=LAANC_APPS[0],airhub=LAANC_APPS[1];
  const row=(link,desc)=>`<li><span class="rl">${link}</span><span class="rd">${desc}</span></li>`;
  const sec=(id,h,items)=>`<section class="grp" id="${id}"><h2>${h}</h2><ul class="rlist">${items.join("")}</ul></section>`;
  return `<div class="reqhead"><h1>Drone Pilot Resources</h1><p>Official sources for current restrictions, weather and rules. SkyClear links to them; always check the source itself for the latest information before you fly.</p></div>
  <nav class="quick" aria-label="Quick links">
   <a class="qk" href="${RES.tfr}" target="_blank" rel="noopener"><b>TFRs</b><small>FAA temporary flight restrictions</small></a>
   <a class="qk" href="${RES.notam}" target="_blank" rel="noopener"><b>NOTAMs</b><small>FAA NOTAM Search</small></a>
   <a class="qk" id="qk-wx" href="${RES.metar}" target="_blank" rel="noopener"><b>Weather</b><small id="qk-wx-ids">METARs: ${RES_METAR_IDS.replace(/,/g,", ")}</small></a>
   <a class="qk" href="${RES.parks}" target="_blank" rel="noopener"><b>Launch Site Rules</b><small>California State Parks drone rules</small></a>
  </nav>
  ${sec("res-airspace","Airspace and authorization",[
    row(ext(aloft.web[1],"Aloft Air Control"),"Airspace checks and LAANC authorization. Step-by-step guide on the <a href=\"#laanc\">LAANC tab</a>."),
    row(ext(airhub.web[1],"AirHub Portal (Airspace Link)"),"Airspace checks and authorization. Step-by-step guide on the <a href=\"#laanc\">LAANC tab</a>."),
    row(ext("https://www.faa.gov/uas/getting_started/temporary_flight_restrictions","FAA Temporary Flight Restrictions"),"Check active and upcoming TFRs. Verify the boundaries, altitude and effective times for your flight."),
    row(ext(RES.notam,"FAA NOTAM Search"),"Check notices for the flight area and nearby airports. Example identifiers: KLAX, KHHR, KBUR, KTOA, KSMO, KLGB."),
    row(ext("https://www.faa.gov/uas/commercial_operators/uas_facility_maps","FAA UAS Facility Maps"),"The altitude grid at your exact flight location. Get FAA authorization where it is required.")])}
  ${sec("res-weather","Weather",[
    row(ext(RES.metar,"SoCal METARs"),"Timestamped observations for LAX, Hawthorne, Burbank, Torrance, Santa Monica and Long Beach."),
    row(ext("https://www.weather.gov/","NWS Local Forecast"),"The forecast for the launch site. Verify actual conditions before takeoff."),
    row(ext("https://www.1800wxbrief.com/","Flight Service (1800wxbrief.com)"),"Official flight briefings, also by phone at 1-800-WX-BRIEF.")])}
  ${sec("res-site","Launch site",[
    row(ext(RES.parks,"California State Parks Drone Rules"),"Check the individual park or district's posted rules. For other sites, verify launch and landing rules with the land manager.")])}
  ${sec("res-rules","Registration and rules",[
    row(ext("https://faadronezone-access.faa.gov/","FAA DroneZone"),"Manage registration and submit applicable FAA authorization requests."),
    row(ext("https://www.faa.gov/uas/getting_started/remote_id","FAA Remote ID"),"Remote ID requirements and compliance options."),
    row(ext("https://www.faa.gov/uas/recreational_flyers","FAA Recreational Flying and TRUST"),"Recreational flying requirements and the TRUST test.")])}
  ${sec("res-charts","Charts and communications",[
    row(ext("https://www.faa.gov/air_traffic/flight_info/aeronav/digital_products/dafd/","FAA Chart Supplement"),"Airport communications, weather sources and procedures. SkyClear's own FAA chart layers are on the <a href=\"#preflight\">Pre-flight map</a>.")])}
  <section class="grp" id="res-phone"><h2>Phone numbers and coordination</h2><div class="scroll"><table class="tb"><thead><tr><th>Contact</th><th>Number</th><th>When</th></tr></thead><tbody>
   <tr><td><b>Emergency services</b></td><td class="n"><a href="tel:911">911</a></td><td>An immediate threat to life or safety.</td></tr>
   <tr><td><b>FAA UAS Support Center</b></td><td class="n"><a href="tel:+18443596982">844-359-6982</a><small><a href="mailto:UASHelp@faa.gov">UASHelp@faa.gov</a></small></td><td>Drone rules, registration and authorization questions.</td></tr>
   <tr><td><b>Flight Service</b></td><td class="n"><a href="tel:+18009927433">1-800-WX-BRIEF</a><small>1-800-992-7433</small></td><td>Official weather and NOTAM briefings.</td></tr>
   <tr><td><b>Site owner or land manager</b></td><td>Varies by site</td><td>Use the contact for the actual launch location.</td></tr>
   <tr><td><b>ATC coordination</b></td><td>See your authorization</td><td>Use the contact in your authorization when coordination is required.</td></tr>
  </tbody></table></div></section>
  <section class="grp" id="res-107"><h2>Part 107 preflight reference<small>${ext("https://www.govinfo.gov/content/pkg/CFR-2025-title14-vol2/xhtml/CFR-2025-title14-vol2-sec107-49.html","14 CFR § 107.49")}</small></h2><div class="req">
   <p>Before flight, the remote pilot in command reviews, as applicable:</p>
   <ul><li>Local weather conditions</li><li>Local airspace and any flight restrictions</li><li>The location of persons and property on the surface, and other ground hazards</li><li>Crew roles, and emergency procedures briefed with everyone involved</li><li>Control links between the control station and the aircraft</li><li>Enough battery power for the planned flight</li><li>Any attached payload secured</li></ul>
   <p class="note">Informational summary. Read the regulation at the link for the exact wording. SkyClear's checklist on the Pre-flight tab covers these items.</p></div></section>`;
}
// The Weather quick link follows the pilot's position: the 3 nearest reporting stations.
function resWxLink(D){const a=$("#qk-wx"),s=$("#qk-wx-ids");if(!a||!D||!D.wxStations||!D.wxStations.length)return;const ids=D.wxStations.map(x=>x.icao).join(",");a.href="https://aviationweather.gov/data/metar/?ids="+ids;s.textContent="METARs near you: "+ids.replace(/,/g,", ")}

/* ---- wiring ---- */
$("#preset").innerHTML=`<option value="" disabled>Custom location</option>`+PRESETS.map(x=>`<option value="${x.k}">${x.name}</option>`).join("");
$("#preset").onchange=e=>{const x=PRESETS.find(z=>z.k===e.target.value);if(!x)return;setLoc(x.lat,x.lon,"preset",x.name,{presetElev:x.elev})};
$("#gps").onclick=useGps;
/* ---- address lookup (via /api/geo: OpenStreetMap, then US Census) ---- */
function pickAddr(r){$("#addrlist").hidden=true;$("#addrlist").innerHTML="";setLoc(r.lat,r.lon,"address",r.label,{geoSrc:r.src});
  $("#gpsmsg").textContent="Found: "+r.label+" · "+(r.src==="OpenStreetMap"?"© OpenStreetMap contributors":"US Census Bureau")+". Check the pin on the map.";}
async function findAddr(){
  const q=$("#addr").value.trim(),msg=$("#gpsmsg"),list=$("#addrlist"),btn=$("#find");
  list.hidden=true;list.innerHTML="";
  if(q.length<3){msg.textContent="Type a street address, city, or place name, then press Find.";return}
  btn.disabled=true;msg.textContent="Looking up the address…";
  try{
    const j=await fetchJson("/api/geo?q="+encodeURIComponent(q),12000);
    const rs=(j&&j.results)||[];
    if(!rs.length){msg.textContent="No match in the United States. Add the city and state, or use GPS or coordinates.";return}
    if(rs.length===1){pickAddr(rs[0]);return}
    window.__addr=rs;msg.textContent="Several matches. Pick the right one:";
    list.innerHTML=rs.map((r,i)=>`<button type="button" data-ai="${i}">${esc(r.label)}<small>${r.lat.toFixed(5)}, ${r.lon.toFixed(5)} · ${r.src==="OpenStreetMap"?"© OpenStreetMap contributors":"US Census Bureau"}</small></button>`).join("");
    list.hidden=false;
  }catch(e){msg.textContent="Address search is unavailable right now. Use GPS, a preset, or type coordinates."}
  finally{btn.disabled=false}
}
$("#find").onclick=findAddr;
$("#addr").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();findAddr()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-ai]");if(b&&window.__addr){pickAddr(window.__addr[+b.dataset.ai])}});
$("#go").onclick=()=>{const la=parseFloat($("#lat").value),lo=parseFloat($("#lon").value);if(!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180){$("#gpsmsg").textContent="Enter latitude and longitude as decimal degrees, for example 33.9164 and -118.3526.";return}$("#gpsmsg").textContent="";setLoc(la,lo,"manual","Manual position")};
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-r]");if(r){S.radius=+r.dataset.r;render();mapUpdate(true);return}
  const w=e.target.closest("[data-w]");if(w){S.wxSel=+w.dataset.w;render();return}
  if(e.target.closest("#wxrefresh")){loadAll();return}
  if(e.target.closest("#profclear")){clearProfile();return}
});
document.addEventListener("change",e=>{if(e.target.matches("input[data-id]")){S.manual[e.target.dataset.id]=e.target.checked;render()}});
document.addEventListener("input",e=>{if(e.target.id==="laanc2"){S.laanc=e.target.value;render();return}if(e.target.id==="laanc"){const o=$("#laanc2");if(o)o.value=e.target.value}const id=e.target.id;if(PROFILE_KEYS.includes(id)){S[id]=e.target.value;saveProfile()}if(["laanc","pilot","cert","certDate","trnDate","model","reg","regExp","ridType","ridId"].includes(id)){S[id]=e.target.value;render()}});
$("#lat").value=S.loc.lat.toFixed(5);$("#lon").value=S.loc.lon.toFixed(5);
loadProfile();
$("#view-req").innerHTML=reqHTML();
$("#view-laanc").innerHTML=laancHTML();
$("#view-res").innerHTML=resHTML();
mapInit();showTab();
$("#gpsmsg").textContent=DEV_FIXED_LOCATION?"Showing "+PRESETS[0].name+". Press Use my GPS, tap the map, or type coordinates.":"";
loadAll();
if(!DEV_FIXED_LOCATION)useGps(true);
// Installable app: register the service worker (it never caches /api weather).
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});

</script>
